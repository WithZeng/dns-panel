services:
  dns-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dns-panel-go
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
