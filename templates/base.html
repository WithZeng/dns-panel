{{ define "base" }}
<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ block "title" . }}DNS Panel{{ end }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
    {{ block "head" . }}{{ end }}
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <!-- Toast container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    {{ block "navbar" . }}
    <nav class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14 items-center">
                <div class="flex items-center gap-1 sm:gap-4 overflow-x-auto">
                    <a href="/dashboard" class="text-lg font-bold text-blue-600 dark:text-blue-400 shrink-0 mr-2">DNS Panel</a>
                    <a href="/dashboard" class="text-xs sm:text-sm text-gray-600 dark:text-gray-300 hover:text-blue-600 whitespace-nowrap px-1.5 py-1">仪表盘</a>
                    <a href="/probe/servers" class="text-xs sm:text-sm text-gray-600 dark:text-gray-300 hover:text-blue-600 whitespace-nowrap px-1.5 py-1">探针</a>
                    <a href="/dns_failover" class="text-xs sm:text-sm text-gray-600 dark:text-gray-300 hover:text-blue-600 whitespace-nowrap px-1.5 py-1">DNS 故障转移</a>
                    <a href="/alert_config" class="text-xs sm:text-sm text-gray-600 dark:text-gray-300 hover:text-blue-600 whitespace-nowrap px-1.5 py-1">告警</a>
                    <a href="/logs" class="text-xs sm:text-sm text-gray-600 dark:text-gray-300 hover:text-blue-600 whitespace-nowrap px-1.5 py-1">日志</a>
                </div>
                <div class="flex items-center gap-4">
                    {{ if .username }}
                    <span class="text-sm text-gray-500">{{ .username }}</span>
                    <a href="/change_password" class="text-sm text-gray-500 hover:text-blue-600">修改密码</a>
                    <a href="/logout" class="text-sm text-red-500 hover:text-red-700">退出</a>
                    {{ end }}
                    <button onclick="toggleDark()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    {{ end }}

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {{ block "content" . }}{{ end }}
    </main>

    <script>
        function toggleDark() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('dark', document.documentElement.classList.contains('dark'));
        }
        if (localStorage.getItem('dark') === 'true') document.documentElement.classList.add('dark');

        function showToast(msg, type) {
            const el = document.createElement('div');
            const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500' };
            el.className = `toast text-white text-sm px-4 py-2 rounded-lg shadow-lg ${colors[type] || colors.info}`;
            el.textContent = msg;
            document.getElementById('toast-container').appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }
    </script>
    <script src="/static/js/utils.js"></script>
    {{ block "scripts" . }}{{ end }}
</body>
</html>
{{ end }}
