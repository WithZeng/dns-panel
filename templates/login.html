{{ define "title" }}登录 - ECS Monitor{{ end }}
{{ define "content" }}
<div class="fixed inset-0 flex items-center justify-center px-4"
  style="background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,.15), transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(14,165,233,.1), transparent 50%);">
  <div class="w-full max-w-sm">
    <div class="bg-slate-900/60 backdrop-blur-2xl rounded-2xl shadow-glow border border-white/[.08] p-6 sm:p-8">
      <div class="flex justify-center mb-4">
        <span class="inline-grid place-items-center w-14 h-14 rounded-2xl bg-indigo-600 text-white text-2xl font-bold">E</span>
      </div>
      <h1 class="text-2xl font-bold text-white text-center">ECS Monitor</h1>
      <p class="text-center text-sm text-slate-400 mt-1">登录以访问控制面板</p>
      {{ if .error }}
      <div class="mt-4 rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-400">{{ .error }}</div>
      {{ end }}
      <form method="POST" class="mt-6 space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-400 mb-1.5">用户名</label>
          <input id="username" name="username" type="text" required autofocus
            class="w-full bg-white/[.06] border border-white/[.1] rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500/50 transition-all">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-400 mb-1.5">密码</label>
          <input id="password" name="password" type="password" required
            class="w-full bg-white/[.06] border border-white/[.1] rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500/50 transition-all">
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 text-white font-medium py-3 rounded-xl hover:bg-indigo-500 transition-colors shadow-lg shadow-indigo-600/20">
          登录
        </button>
      </form>
    </div>
    <p class="text-center text-xs text-slate-600 mt-6">
      ECS Monitor &middot; <a href="https://github.com/WithZeng/dns-panel" target="_blank" class="hover:text-slate-400 transition">GitHub</a>
    </p>
  </div>
</div>
{{ end }}
{{ template "base" . }}
