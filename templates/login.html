{{ define "title" }}登录 - ECS Monitor{{ end }}
{{ define "navbar" }}{{ end }}
{{ define "content" }}
<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900">
  <div class="mx-auto w-full max-w-sm">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 p-6 sm:p-8">
      <div class="flex justify-center mb-4">
        <span class="inline-grid place-items-center w-12 h-12 rounded-2xl bg-slate-900 text-white dark:bg-blue-600 text-xl font-bold">E</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-white text-center">登录</h1>
      {{ if .error }}
      <div class="mt-4 rounded-xl border border-red-200 dark:border-red-700 bg-red-50 dark:bg-red-900/30 px-4 py-3 text-sm text-red-700 dark:text-red-300">{{ .error }}</div>
      {{ end }}
      <form method="POST" class="mt-6 space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">用户名</label>
          <input id="username" name="username" type="text" required autofocus
            class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">密码</label>
          <input id="password" name="password" type="password" required
            class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>
        <button type="submit"
          class="w-full bg-slate-900 dark:bg-blue-600 text-white font-medium py-3 rounded-xl hover:bg-slate-800 dark:hover:bg-blue-700 transition-colors shadow-lg shadow-slate-900/10">
          登录
        </button>
      </form>
    </div>
  </div>
</div>
{{ end }}
{{ template "base" . }}
