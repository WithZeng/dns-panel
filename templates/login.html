{{ define "title" }}登录 - CloudPanel{{ end }}
{{ define "content" }}
<div class="fixed inset-0 flex items-center justify-center px-4 bg-gray-50 dark:bg-gray-950">
  <div class="w-full max-w-sm">
    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-800 p-6 sm:p-8">
      <div class="flex justify-center mb-4">
        <span class="inline-grid place-items-center w-12 h-12 rounded-2xl bg-emerald-600 text-white text-xl font-bold">C</span>
      </div>
      <h1 class="text-xl font-bold text-gray-900 dark:text-white text-center">CloudPanel</h1>
      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-1">登录以访问控制面板</p>
      {{ if .error }}
      <div class="mt-4 rounded-xl border border-red-200 dark:border-red-500/20 bg-red-50 dark:bg-red-500/10 px-4 py-2.5 text-sm text-red-700 dark:text-red-400">{{ .error }}</div>
      {{ end }}
      <form method="POST" class="mt-6 space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-1.5">用户名</label>
          <input id="username" name="username" type="text" required autofocus
            class="w-full bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl px-3.5 py-2.5 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-1.5">密码</label>
          <input id="password" name="password" type="password" required
            class="w-full bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl px-3.5 py-2.5 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
        </div>
        <button type="submit"
          class="w-full bg-emerald-600 text-white font-medium py-2.5 rounded-xl hover:bg-emerald-700 transition-colors text-sm">
          登录
        </button>
      </form>
    </div>
    <p class="text-center text-xs text-gray-400 mt-5">
      CloudPanel &middot; <a href="https://github.com/WithZeng/dns-panel" target="_blank" class="hover:text-gray-600 dark:hover:text-gray-300 transition">GitHub</a>
    </p>
  </div>
</div>
{{ end }}
{{ template "base" . }}
