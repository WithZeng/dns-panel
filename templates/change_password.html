{{ define "title" }}修改密码 - CloudPanel{{ end }}
{{ define "content" }}
<div class="max-w-md mx-auto">
    <h1 class="text-xl font-bold mb-6">修改密码</h1>

    {{ if .error }}
    <div class="bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-700 rounded-xl px-4 py-3 text-sm mb-4">
        {{ .error }}
    </div>
    {{ end }}

    <form method="POST" action="/change_password" class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 p-6 space-y-4">
        <div>
            <label for="old_password" class="block text-sm font-medium mb-1">原密码</label>
            <input type="password" id="old_password" name="old_password" required
                class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>
        <div>
            <label for="new_password" class="block text-sm font-medium mb-1">新密码</label>
            <input type="password" id="new_password" name="new_password" required minlength="8"
                class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>
        <div>
            <label for="confirm_password" class="block text-sm font-medium mb-1">确认新密码</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
                class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>
        <button type="submit"
            class="w-full bg-gray-900 dark:bg-blue-600 text-white hover:bg-gray-800 dark:hover:bg-blue-700 font-medium py-2.5 rounded-lg text-sm">
            修改密码
        </button>
    </form>
</div>
{{ end }}

{{ template "base" . }}
