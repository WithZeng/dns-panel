{{ define "title" }}修改密码 - DNS Panel{{ end }}
{{ define "content" }}
<div class="max-w-md mx-auto">
    <h1 class="text-xl font-bold mb-6">修改密码</h1>

    {{ if .error }}
    <div class="bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 text-sm rounded-lg px-4 py-3 mb-4">
        {{ .error }}
    </div>
    {{ end }}

    <form method="POST" action="/change_password" class="bg-white dark:bg-gray-800 rounded-xl shadow p-6 space-y-4">
        <div>
            <label for="old_password" class="block text-sm font-medium mb-1">原密码</label>
            <input type="password" id="old_password" name="old_password" required
                class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
        </div>
        <div>
            <label for="new_password" class="block text-sm font-medium mb-1">新密码</label>
            <input type="password" id="new_password" name="new_password" required minlength="8"
                class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
        </div>
        <div>
            <label for="confirm_password" class="block text-sm font-medium mb-1">确认新密码</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
                class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
        </div>
        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm">
            修改密码
        </button>
    </form>
</div>
{{ end }}

{{ template "base" . }}
