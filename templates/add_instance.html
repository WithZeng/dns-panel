{{ define "title" }}添加实例 - ECS Monitor{{ end }}
{{ define "content" }}
<div class="max-w-2xl mx-auto">
    <h1 class="text-xl font-bold mb-6">添加 ECS 实例</h1>

    {{ if .error }}
    <div class="bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-700 rounded-xl px-4 py-3 text-sm mb-4">{{ .error }}</div>
    {{ end }}

    <form method="POST" action="/instance/add" class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 p-6 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">名称 *</label>
                <input type="text" name="name" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Instance ID *</label>
                <input type="text" name="instance_id" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Access Key ID *</label>
                <input type="text" name="access_key_id" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Access Key Secret *</label>
                <input type="password" name="access_key_secret" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">地域 *</label>
                <input type="text" name="region_id" required placeholder="cn-shenzhen" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">流量策略</label>
                <select name="traffic_strategy" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    <option value="cycle">月付 (cycle)</option>
                    <option value="life">终身 (life)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">月流量限额 (GB)</label>
                <input type="number" name="monthly_limit" step="0.01" value="0" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">终身流量限额 (GB)</label>
                <input type="number" name="life_total_limit" step="0.01" value="0" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">标签</label>
                <input type="text" name="tag" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">告警阈值 (%)</label>
                <input type="number" name="alert_threshold_pct" value="80" min="0" max="100" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>
        </div>
        <div class="flex items-center gap-6 pt-2">
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="monitoring_enabled" checked class="rounded"> 启用监控
            </label>
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="auto_start_enabled" class="rounded"> 自动启动
            </label>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-slate-900 dark:bg-blue-600 text-white hover:bg-slate-800 dark:hover:bg-blue-700 font-medium px-6 py-2.5 rounded-xl text-sm">添加</button>
            <a href="/dashboard" class="text-slate-500 px-4 py-2.5 text-sm">取消</a>
        </div>
    </form>
</div>
{{ end }}

{{ template "base" . }}
