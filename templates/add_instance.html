{{ define "title" }}添加实例 - DNS Panel{{ end }}
{{ define "content" }}
<div class="max-w-2xl mx-auto">
    <h1 class="text-xl font-bold mb-6">添加 ECS 实例</h1>

    {{ if .error }}
    <div class="bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 text-sm rounded-lg px-4 py-3 mb-4">{{ .error }}</div>
    {{ end }}

    <form method="POST" action="/instance/add" class="bg-white dark:bg-gray-800 rounded-xl shadow p-6 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">名称 *</label>
                <input type="text" name="name" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Instance ID *</label>
                <input type="text" name="instance_id" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Access Key ID *</label>
                <input type="text" name="access_key_id" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Access Key Secret *</label>
                <input type="password" name="access_key_secret" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">地域 *</label>
                <input type="text" name="region_id" required placeholder="cn-shenzhen" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">流量策略</label>
                <select name="traffic_strategy" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
                    <option value="cycle">月付 (cycle)</option>
                    <option value="life">终身 (life)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">月流量限额 (GB)</label>
                <input type="number" name="monthly_limit" step="0.01" value="0" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">终身流量限额 (GB)</label>
                <input type="number" name="life_total_limit" step="0.01" value="0" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">标签</label>
                <input type="text" name="tag" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">告警阈值 (%)</label>
                <input type="number" name="alert_threshold_pct" value="80" min="0" max="100" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
        </div>
        <div class="flex items-center gap-6 pt-2">
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="monitoring_enabled" checked class="rounded"> 启用监控
            </label>
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="auto_start_enabled" class="rounded"> 自动启动
            </label>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm">添加</button>
            <a href="/dashboard" class="text-gray-500 hover:text-gray-700 px-4 py-2.5 text-sm">取消</a>
        </div>
    </form>
</div>
{{ end }}

{{ template "base" . }}
