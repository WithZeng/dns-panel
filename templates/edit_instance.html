{{ define "title" }}编辑实例 - DNS Panel{{ end }}
{{ define "content" }}
<div class="max-w-2xl mx-auto">
    <h1 class="text-xl font-bold mb-6">编辑: {{ .instance.Name }}</h1>

    <form method="POST" action="/instance/edit/{{ .instance.ID }}" class="bg-white dark:bg-gray-800 rounded-xl shadow p-6 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">名称</label>
                <input type="text" name="name" value="{{ .instance.Name }}" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Instance ID</label>
                <input type="text" name="instance_id" value="{{ .instance.InstanceID }}" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Access Key ID (留空不修改)</label>
                <input type="text" name="access_key_id" placeholder="留空不修改" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Access Key Secret (留空不修改)</label>
                <input type="password" name="access_key_secret" placeholder="留空不修改" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">地域</label>
                <input type="text" name="region_id" value="{{ .instance.RegionID }}" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">流量策略</label>
                <select name="traffic_strategy" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
                    <option value="cycle" {{ if eq .instance.TrafficStrategy "cycle" }}selected{{ end }}>月付</option>
                    <option value="life" {{ if eq .instance.TrafficStrategy "life" }}selected{{ end }}>终身</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">月流量限额 (GB)</label>
                <input type="number" name="monthly_limit" step="0.01" value="{{ .instance.MonthlyLimit }}" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">终身流量限额 (GB)</label>
                <input type="number" name="life_total_limit" step="0.01" value="{{ .instance.LifeTotalLimit }}" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">标签</label>
                <input type="text" name="tag" value="{{ .instance.Tag }}" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">告警阈值 (%)</label>
                <input type="number" name="alert_threshold_pct" value="{{ .instance.AlertThresholdPct }}" min="0" max="100" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">备注</label>
            <textarea name="notes" rows="3" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">{{ .instance.Notes }}</textarea>
        </div>
        <div class="flex items-center gap-6 pt-2">
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="monitoring_enabled" {{ if .instance.MonitorEnabled }}checked{{ end }} class="rounded"> 启用监控
            </label>
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="auto_start_enabled" {{ if .instance.AutoStartEnabled }}checked{{ end }} class="rounded"> 自动启动
            </label>
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="auto_stop_enabled" {{ if .instance.AutoStopEnabled }}checked{{ end }} class="rounded"> 超额停机
            </label>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm">保存</button>
            <a href="/instance/{{ .instance.ID }}" class="text-gray-500 hover:text-gray-700 px-4 py-2.5 text-sm">取消</a>
        </div>
    </form>
</div>
{{ end }}

{{ template "base" . }}
